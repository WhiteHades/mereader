[package]
name = "mereader"
version = "0.1.0"
description = "AI-enhanced eBook reader"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ammonia = "4.1.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
quick-xml = { version = "0.41.0", features = ["escape-html"] }
rbook = { version = "0.7.10", default-features = false, features = ["threadsafe"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.22.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
